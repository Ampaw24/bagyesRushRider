plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// The project's .env (also bundled into the app by flutter_dotenv) is the
// single source of truth for API keys, so the Maps SDK key in the manifest
// can never drift from it. Parsed by hand rather than with Properties, which
// would keep surrounding quotes and treat ':' as a separator.
def dotenv = [:]
def dotenvFile = rootProject.file('../.env')
if (dotenvFile.exists()) {
    dotenvFile.eachLine('UTF-8') { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) return
        def separator = trimmed.indexOf('=')
        def value = trimmed.substring(separator + 1).trim()
        if (value.length() >= 2 && (value[0] == '"' || value[0] == "'") && value[-1] == value[0]) {
            value = value.substring(1, value.length() - 1)
        }
        dotenv[trimmed.substring(0, separator).trim()] = value
    }
}
def mapsApiKey = dotenv['G_CLIENTID_ANDROID']
if (!mapsApiKey) {
    throw new GradleException('G_CLIENTID_ANDROID is missing from .env — the Google Maps SDK needs it.')
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.bagye.bagyesrushrider"
    compileSdk 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.bagye.bagyesrushrider"
        minSdk flutter.minSdkVersion
        targetSdk 35
        versionCode 2
        versionName '2.0'
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source '../..'
}
