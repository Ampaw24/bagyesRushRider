name: delivery_boy
description: BagyesRUSH rider delivery app

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  fluttertoast: ^8.2.8
  flutter_spinkit: ^5.2.1
  flutter_slidable: ^3.1.1
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  dotted_border: ^2.1.0
  http: ^1.2.2
  http_interceptor: ^2.0.0
  image_picker: ^1.1.2
  geocoding: ^3.0.0
  location: ^7.0.0
  url_launcher: ^6.3.1
  intl: ^0.19.0
  # Clean Architecture dependencies
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  get_it: ^8.0.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.0.0
  logger: ^2.6.2
  hugeicons: ^0.0.7
  flutter_svg: ^2.3.0
  # Firebase / Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_dotenv: ^6.0.1
  package_info_plus: ^9.0.1
  # Supplies the `device_name` sent to POST /device-tokens. Same version as
  # the customer app so both register devices in an identical format.
  device_info_plus: ^12.4.0
  flutter_html: ^3.0.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon_ios.png"
  adaptive_icon_background: "#E91D25"
  adaptive_icon_foreground: "assets/images/app_icon_android_fg.png"
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo_android12.png"
  color_dark: "#121212"
  image_dark: "assets/images/splash_logo_android12.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/splash_logo_android12.png"
    icon_background_color: "#FFFFFF"
    color_dark: "#121212"
    image_dark: "assets/images/splash_logo_android12.png"
    icon_background_color_dark: "#121212"
  web: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/onboarding/

  fonts:
    - family: Mukta
      fonts:
        - asset: fonts/mukta/Mukta-Regular.ttf
        - asset: fonts/mukta/Mukta-Light.ttf
          weight: 300
        - asset: fonts/mukta/Mukta-Medium.ttf
          weight: 500
    - family: Pacifico
      fonts:
        - asset: fonts/pecifico/Pacifico-Regular.ttf
    - family: Roboto
      fonts:
        - asset: fonts/roboto/Roboto-Regular.ttf
        - asset: fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: fonts/roboto/Roboto-Medium.ttf
          weight: 500
